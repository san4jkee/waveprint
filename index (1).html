<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Plotter Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"/>
<style>
/* ─── Reset ─────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

/* ─── Variables ─────────────────────────────────────────────────────────── */
:root{
  --bg:#0e0e10;--surf:#18181c;--surf2:#222228;--border:#2e2e38;
  --accent:#c8f050;--accent2:#50c8f0;--text:#e8e8ee;--muted:#8888a0;
  --danger:#f05050;--r:10px;
  --mono:'Space Mono','Courier New',monospace;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}

/* ─── Layout ─────────────────────────────────────────────────────────────── */
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;
}

.app-row{
  -webkit-box-flex:1;-ms-flex:1;flex:1;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  min-height:0;overflow:hidden;
}

/* ─── Header ─────────────────────────────────────────────────────────────── */
header{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  gap:14px;padding:0 24px;height:56px;
  border-bottom:1px solid var(--border);background:var(--surf);
  -ms-flex-negative:0;flex-shrink:0;
}
.logo{font-family:var(--mono);font-size:15px;letter-spacing:.06em;color:var(--accent)}
.logo span{color:var(--muted)}
.badge{
  font-size:10px;font-family:var(--mono);background:var(--surf2);
  border:1px solid var(--border);color:var(--muted);
  padding:2px 8px;border-radius:100px;letter-spacing:.08em;
}
.hd-status{
  margin-left:auto;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  gap:6px;font-size:11px;font-family:var(--mono);color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);
  -webkit-transition:background .3s;transition:background .3s}
.dot.ok{background:var(--accent)}
.dot.err{background:var(--danger)}

/* ─── Sidebar ────────────────────────────────────────────────────────────── */
aside{
  width:340px;-ms-flex-negative:0;flex-shrink:0;
  background:var(--surf);border-right:1px solid var(--border);
  overflow-y:auto;padding:18px 14px;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;
  gap:18px;
}
.slabel{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--muted);text-transform:uppercase;margin-bottom:8px;
}

/* Upload */
.upload-zone{
  border:1.5px dashed var(--border);border-radius:var(--r);
  padding:22px 14px;text-align:center;cursor:pointer;position:relative;
  -webkit-transition:border-color .2s,background .2s;transition:border-color .2s,background .2s;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(200,240,80,.05)}
.upload-zone input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.upload-icon{font-size:26px;margin-bottom:6px}
.upload-zone p{font-size:12px;color:var(--muted);line-height:1.5}
.upload-zone strong{color:var(--text)}
.thumb-wrap{display:none;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);position:relative}
.thumb-wrap img{width:100%;display:block}
.thumb-clear{
  position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;
  border:none;border-radius:50%;width:22px;height:22px;font-size:13px;
  line-height:22px;text-align:center;cursor:pointer;
}

/* Mode grid */
.mode-grid{
  display:-ms-grid;display:grid;
  -ms-grid-columns:1fr 6px 1fr;grid-template-columns:1fr 1fr;gap:6px;
}
.mode-btn{
  background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:10px 8px;cursor:pointer;text-align:left;
  -webkit-transition:border-color .15s,background .15s;transition:border-color .15s,background .15s;
}
.mode-btn:hover{border-color:var(--muted)}
.mode-btn.active{border-color:var(--accent);background:rgba(200,240,80,.08)}
.mode-btn .mn{font-family:var(--mono);font-size:11px;color:var(--accent);display:block;margin-bottom:3px}
.mode-btn .md{font-size:11px;color:var(--muted);line-height:1.4}

/* Params */
#params-area{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;gap:12px;
}
.param-row{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;gap:4px;
}
.param-head{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-pack:justify;-ms-flex-pack:justify;justify-content:space-between;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;font-size:12px;
}
.param-head label{color:var(--text);font-weight:500}
.param-val{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:34px;text-align:right}
.param-tip{font-size:11px;color:var(--muted);line-height:1.4}

/* Range slider — all engines */
input[type=range]{
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  width:100%;height:4px;border-radius:2px;
  background:var(--surf2);outline:none;cursor:pointer;border:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);cursor:pointer;border:none;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:none;
}
input[type=range]::-ms-thumb{
  width:14px;height:14px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:none;
}
input[type=range]::-ms-track{background:var(--surf2);border:none;color:transparent;height:4px}

/* Toggle */
.toggle-row{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-pack:justify;-ms-flex-pack:justify;justify-content:space-between;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
}
.toggle-wrap{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  gap:8px;font-size:12px;color:var(--text);font-weight:500;
}
.toggle{
  position:relative;width:34px;height:18px;background:var(--surf2);
  border:1px solid var(--border);border-radius:9px;cursor:pointer;
  -webkit-transition:background .2s,border-color .2s;transition:background .2s,border-color .2s;
  -ms-flex-negative:0;flex-shrink:0;
}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:12px;height:12px;border-radius:50%;background:var(--muted);
  -webkit-transition:-webkit-transform .2s,background .2s;transition:transform .2s,background .2s;
}
.toggle.on::after{-webkit-transform:translateX(16px);transform:translateX(16px);background:var(--bg)}

/* Process button */
.process-btn{
  width:100%;padding:13px;background:var(--accent);color:var(--bg);
  border:none;border-radius:var(--r);font-family:var(--mono);font-size:13px;
  font-weight:700;letter-spacing:.08em;cursor:pointer;margin-top:auto;
  -webkit-transition:opacity .15s,-webkit-transform .1s;transition:opacity .15s,transform .1s;
}
.process-btn:hover{opacity:.88}
.process-btn:active{-webkit-transform:scale(.98);transform:scale(.98)}
.process-btn:disabled{opacity:.35;cursor:not-allowed}

/* ─── Main ───────────────────────────────────────────────────────────────── */
main{
  -webkit-box-flex:1;-ms-flex:1;flex:1;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;
  overflow:hidden;min-width:0;
}

/* Toolbar */
.toolbar{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  gap:10px;padding:10px 18px;
  border-bottom:1px solid var(--border);background:var(--surf);
  -ms-flex-negative:0;flex-shrink:0;
}
.tinfo{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  display:-webkit-box;display:-ms-flexbox;display:flex;gap:16px;
}
.tinfo b{color:var(--text);font-weight:400}
.tb-btn{
  margin-left:auto;padding:6px 14px;background:var(--surf2);
  border:1px solid var(--border);border-radius:6px;color:var(--text);
  font-size:12px;font-family:var(--mono);cursor:pointer;text-decoration:none;
  display:-webkit-inline-box;display:-ms-inline-flexbox;display:inline-flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;gap:5px;
  -webkit-transition:border-color .15s,color .15s;transition:border-color .15s,color .15s;
}
.tb-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.tb-btn.off{opacity:.35;pointer-events:none}

/* View tabs */
.view-tabs{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  gap:2px;padding:8px 16px 0;
  background:var(--surf);border-bottom:1px solid var(--border);
  -ms-flex-negative:0;flex-shrink:0;
}
.vtab{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  padding:6px 14px;border-radius:6px 6px 0 0;
  border:1px solid transparent;border-bottom:none;
  cursor:pointer;color:var(--muted);background:transparent;
  -webkit-transition:color .15s;transition:color .15s;
}
.vtab:hover{color:var(--text)}
.vtab.on{color:var(--accent);background:var(--bg);border-color:var(--border)}

/* ─── Panels container ───────────────────────────────────────────────────── */
.panels{
  -webkit-box-flex:1;-ms-flex:1;flex:1;
  position:relative;overflow:hidden;min-height:0;
}

/* All panels: absolute fill, hidden by default */
.panel{
  position:absolute;top:0;left:0;right:0;bottom:0;
  /* display:none until .on — set via JS style, not CSS, for IE compat */
  overflow:hidden;
}

/* ── Empty panel ── */
#p-empty{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  text-align:center;color:var(--muted);
}
.empty-ico{font-size:52px;line-height:1;margin-bottom:14px;opacity:.25}
#p-empty p{font-size:14px;line-height:1.8}
#p-empty strong{color:var(--text)}

/* ── Split panel ── */
#p-split{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:horizontal;-webkit-box-direction:normal;
  -ms-flex-direction:row;flex-direction:row;
}
.sp{
  -webkit-box-flex:1;-ms-flex:1;flex:1;min-width:0;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;
  border-right:1px solid var(--border);overflow:hidden;
}
.sp:last-child{border-right:none}
.sp-lbl{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--muted);padding:8px 14px;
  border-bottom:1px solid var(--border);
  -ms-flex-negative:0;flex-shrink:0;
}
.sp-body{
  -webkit-box-flex:1;-ms-flex:1;flex:1;
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  padding:20px;overflow:auto;min-height:0;
}

/* ── Result / Original single panels ── */
#p-result,#p-original{
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  padding:28px;overflow:auto;
}

/* Shared image/svg styles */
.pimg{
  display:block;
  max-width:100%;max-height:100%;
  width:auto;height:auto;
  border-radius:var(--r);border:1px solid var(--border);
  -ms-flex-negative:1;flex-shrink:1;object-fit:contain;
}
.psvg{
  display:block;
  max-width:100%;max-height:100%;
  width:auto;height:auto;
  border-radius:var(--r);border:1px solid var(--border);
  background:#fff;-ms-flex-negative:1;flex-shrink:1;
}

/* Loading overlay */
.overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(14,14,16,.85);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:-webkit-box;display:-ms-flexbox;display:flex;
  -webkit-box-align:center;-ms-flex-align:center;align-items:center;
  -webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;
  -webkit-box-orient:vertical;-webkit-box-direction:normal;
  -ms-flex-direction:column;flex-direction:column;
  gap:14px;z-index:10;
}
.spin{
  width:34px;height:34px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  -webkit-animation:spin .7s linear infinite;animation:spin .7s linear infinite;
}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-txt{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em}

/* Toast */
.toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:var(--r);padding:11px 16px;font-size:13px;color:var(--text);
  z-index:999;max-width:300px;pointer-events:none;
  -webkit-transform:translateY(70px);transform:translateY(70px);opacity:0;
  -webkit-transition:-webkit-transform .25s,opacity .25s;transition:transform .25s,opacity .25s;
}
.toast.on{-webkit-transform:none;transform:none;opacity:1}
.toast.ok{border-color:var(--accent)}
.toast.err{border-color:var(--danger);color:var(--danger)}

/* Scrollbar (webkit) */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">PLOTTER<span>.studio</span></div>
  <span class="badge">ALPHA</span>
  <div class="hd-status">
    <div class="dot" id="dot"></div>
    <span id="srv-txt">connecting…</span>
  </div>
</header>

<div class="app-row">

<!-- ── Sidebar ────────────────────────────────────────────────────────────── -->
<aside>
  <section>
    <div class="slabel">Изображение</div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.bmp,.webp"/>
      <div class="upload-icon">⬆</div>
      <p><strong>Перетащи или кликни</strong><br/>JPG PNG BMP WEBP · до 20 МБ</p>
    </div>
    <div class="thumb-wrap" id="thumb-wrap">
      <img id="thumb" src="" alt="preview"/>
      <button class="thumb-clear" id="thumb-clear" title="Удалить">✕</button>
    </div>
  </section>

  <section>
    <div class="slabel">Режим</div>
    <div class="mode-grid" id="mode-grid"></div>
  </section>

  <section>
    <div class="slabel">Настройки</div>
    <div id="params-area"></div>
  </section>

  <button class="process-btn" id="process-btn" disabled>▶ ОБРАБОТАТЬ</button>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────────────── -->
<main>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="tinfo">
      <span>режим: <b id="i-mode">—</b></span>
      <span>линий: <b id="i-lines">—</b></span>
      <span>время: <b id="i-time">—</b></span>
    </div>
    <a class="tb-btn off" id="dl-btn">↓ SVG</a>
  </div>

  <!-- View tabs (hidden until first result) -->
  <div class="view-tabs" id="view-tabs" style="display:none">
    <button class="vtab on" data-panel="p-split">SPLIT</button>
    <button class="vtab"    data-panel="p-result">РЕЗУЛЬТАТ</button>
    <button class="vtab"    data-panel="p-original">ОРИГИНАЛ</button>
  </div>

  <!-- Panels -->
  <div class="panels" id="panels">

    <!-- Empty state -->
    <div class="panel" id="p-empty">
      <div>
        <div class="empty-ico">✏</div>
        <p>Загрузи фото и выбери режим,<br/>затем нажми <strong>Обработать</strong></p>
      </div>
    </div>

    <!-- SPLIT: оригинал | результат -->
    <div class="panel" id="p-split">
      <div class="sp">
        <div class="sp-lbl">ОРИГИНАЛ</div>
        <div class="sp-body">
          <img class="pimg" id="orig-split" src="" alt="original"/>
        </div>
      </div>
      <div class="sp">
        <div class="sp-lbl">РЕЗУЛЬТАТ · SVG</div>
        <div class="sp-body">
          <svg class="psvg" id="svg-split" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </div>

    <!-- РЕЗУЛЬТАТ only -->
    <div class="panel" id="p-result">
      <svg class="psvg" id="svg-result" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- ОРИГИНАЛ only -->
    <div class="panel" id="p-original">
      <img class="pimg" id="orig-full" src="" alt="original"/>
    </div>

    <!-- Loading overlay (covers all panels) -->
    <div class="overlay" id="overlay" style="display:none">
      <div class="spin"></div>
      <div class="spin-txt" id="spin-txt">ОБРАБОТКА…</div>
    </div>

  </div><!-- /panels -->
</main>

</div><!-- /app-row -->

<div class="toast" id="toast"></div>

<script>
/* jshint esversion:5 */
'use strict';

var API = 'http://localhost:5000/api';

var MODE_META = {
  contour:   {e:'✏', d:'Контуры краёв объектов'},
  hatching:  {e:'≡', d:'Параллельная штриховка'},
  stippling: {e:'·', d:'Точечное заполнение'},
  flowfield: {e:'∿', d:'Линии поля потока'},
};

var state = {
  imageId:   null,
  origSrc:   null,
  mode:      'contour',
  params:    {},
  modesData: null,
  busy:      false,
};

/* ── Helpers: show/hide with display style ─────────────────────────────── */
function show(el, disp) {
  el.style.display = disp || 'flex';
}
function hide(el) {
  el.style.display = 'none';
}

/* ── Panel switcher ────────────────────────────────────────────────────── */
var PANELS = ['p-empty','p-split','p-result','p-original'];
var currentPanel = 'p-empty';

function showPanel(id) {
  for (var i = 0; i < PANELS.length; i++) {
    var el = document.getElementById(PANELS[i]);
    if (el) hide(el);
  }
  var next = document.getElementById(id);
  if (next) show(next, (id === 'p-split') ? 'flex' : 'flex');
  currentPanel = id;

  /* update tab highlights */
  var tabs = document.querySelectorAll('.vtab');
  for (var t = 0; t < tabs.length; t++) {
    var active = tabs[t].getAttribute('data-panel') === id;
    tabs[t].className = active ? 'vtab on' : 'vtab';
  }
}

/* Wire tab buttons */
(function() {
  var tabs = document.querySelectorAll('.vtab');
  for (var i = 0; i < tabs.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        showPanel(btn.getAttribute('data-panel'));
      });
    })(tabs[i]);
  }
})();

/* Initial state: show empty panel */
showPanel('p-empty');

/* ── Init ──────────────────────────────────────────────────────────────── */
function init() {
  fetch(API + '/modes')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      state.modesData = data;
      state.params = JSON.parse(JSON.stringify(data.defaults));
      renderModes();
      renderParams();
      return fetch(API + '/health');
    })
    .then(function() { setDot('ok', 'сервер готов'); })
    .catch(function() {
      setDot('err', 'сервер недоступен');
      showToast('Запусти server.py на localhost:5000', 'err');
    });
}

function setDot(cls, txt) {
  document.getElementById('dot').className = 'dot ' + cls;
  document.getElementById('srv-txt').textContent = txt;
}

/* ── Upload ────────────────────────────────────────────────────────────── */
var uploadZone = document.getElementById('upload-zone');
var fileInput  = document.getElementById('file-input');
var thumbWrap  = document.getElementById('thumb-wrap');
var thumbImg   = document.getElementById('thumb');

uploadZone.addEventListener('dragover', function(e) {
  e.preventDefault();
  uploadZone.classList.add('drag');
});
uploadZone.addEventListener('dragleave', function() {
  uploadZone.classList.remove('drag');
});
uploadZone.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  if (e.dataTransfer && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function() {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});
document.getElementById('thumb-clear').addEventListener('click', function() {
  state.imageId = null;
  state.origSrc = null;
  thumbWrap.style.display = 'none';
  show(uploadZone, 'block');
  fileInput.value = '';
  updateBtn();
});

function handleFile(file) {
  var fd = new FormData();
  fd.append('file', file);
  uploadZone.style.display = 'none';
  thumbWrap.style.display = 'block';
  /* immediate local preview */
  var URL = window.URL || window.webkitURL;
  thumbImg.src = URL.createObjectURL(file);

  fetch(API + '/upload', {method:'POST', body:fd})
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      state.imageId = data.image_id;
      state.origSrc = data.thumbnail;
      thumbImg.src  = data.thumbnail;
      showToast('Загружено: ' + data.filename + ' (' + data.size[0] + '×' + data.size[1] + ')', 'ok');
    })
    .catch(function(e) {
      showToast(e.message, 'err');
      thumbWrap.style.display = 'none';
      show(uploadZone, 'block');
    })
    .then(function() { updateBtn(); });
}

/* ── Modes ─────────────────────────────────────────────────────────────── */
function renderModes() {
  var grid  = document.getElementById('mode-grid');
  grid.innerHTML = '';
  var modes = (state.modesData && state.modesData.modes) || [];
  for (var i = 0; i < modes.length; i++) {
    (function(m) {
      var info = MODE_META[m] || {};
      var btn  = document.createElement('button');
      btn.className = 'mode-btn' + (m === state.mode ? ' active' : '');
      btn.innerHTML = '<span class="mn">' + (info.e||'') + ' ' + m + '</span>'
                    + '<span class="md">' + (info.d||'') + '</span>';
      btn.addEventListener('click', function() {
        state.mode = m; renderModes(); renderParams();
      });
      grid.appendChild(btn);
    })(modes[i]);
  }
}

/* ── Params ────────────────────────────────────────────────────────────── */
function renderParams() {
  var area = document.getElementById('params-area');
  area.innerHTML = '';
  if (!state.modesData) return;
  var meta = state.modesData.meta[state.mode]     || [];
  var defs = state.modesData.defaults[state.mode] || {};
  if (!state.params[state.mode])
    state.params[state.mode] = JSON.parse(JSON.stringify(defs));
  var p = state.params[state.mode];

  for (var i = 0; i < meta.length; i++) {
    (function(m) {
      if (p[m.key] === undefined) p[m.key] = defs[m.key];
      var row = document.createElement('div');
      row.className = 'param-row';

      if (m.type === 'bool') {
        var val = !!p[m.key];
        row.innerHTML =
          '<div class="toggle-row"><div class="toggle-wrap">'
          + '<div class="toggle' + (val ? ' on' : '') + '"></div>'
          + '<label>' + m.label + '</label>'
          + '</div></div>'
          + '<div class="param-tip">' + (m.tip||'') + '</div>';
        (function(key, toggleEl) {
          toggleEl.addEventListener('click', function() {
            p[key] = !p[key];
            toggleEl.className = 'toggle' + (p[key] ? ' on' : '');
          });
        })(m.key, row.querySelector('.toggle'));

      } else {
        var cur = (p[m.key] !== undefined) ? p[m.key] : m.min;
        var vid = 'pv-' + m.key;
        row.innerHTML =
          '<div class="param-head"><label>' + m.label + '</label>'
          + '<span class="param-val" id="' + vid + '">' + cur + '</span></div>'
          + '<input type="range" min="' + m.min + '" max="' + m.max
          + '" step="' + m.step + '" value="' + cur + '"/>'
          + '<div class="param-tip">' + (m.tip||'') + '</div>';
        (function(key, valId) {
          row.querySelector('input').addEventListener('input', function() {
            var v = parseFloat(this.value);
            p[key] = v;
            document.getElementById(valId).textContent = v;
          });
        })(m.key, vid);
      }
      area.appendChild(row);
    })(meta[i]);
  }
}

/* ── SVG helpers ───────────────────────────────────────────────────────── */
function parseSvg(txt) {
  var parser = new DOMParser();
  var doc = parser.parseFromString(txt, 'image/svg+xml');
  /* check for parse error */
  if (doc.querySelector('parsererror')) return null;
  return doc.querySelector('svg');
}

/**
 * Copy viewBox + content from `src` into `dst`.
 * Removes explicit width/height so CSS max-width/max-height controls size.
 */
function fillSvg(dst, src) {
  /* remove all existing attributes */
  while (dst.attributes.length > 0) {
    dst.removeAttribute(dst.attributes[0].name);
  }
  /* copy attributes from src */
  for (var i = 0; i < src.attributes.length; i++) {
    var a = src.attributes[i];
    dst.setAttribute(a.name, a.value);
  }
  /* drop fixed dimensions — let CSS handle size */
  dst.removeAttribute('width');
  dst.removeAttribute('height');
  /* copy content */
  dst.innerHTML = src.innerHTML;
}

/* ── Process ───────────────────────────────────────────────────────────── */
document.getElementById('process-btn').addEventListener('click', doProcess);

function doProcess() {
  if (!state.imageId || state.busy) return;
  state.busy = true;
  updateBtn();

  var overlay = document.getElementById('overlay');
  var spinTxt = document.getElementById('spin-txt');
  show(overlay, 'flex');

  var steps = ['АНАЛИЗ ИЗОБРАЖЕНИЯ…','ТРАССИРОВКА ЛИНИЙ…','ОПТИМИЗАЦИЯ ПУТЕЙ…','ГЕНЕРАЦИЯ SVG…'];
  var si = 0;
  spinTxt.textContent = steps[0];
  var timer = setInterval(function() {
    si = (si + 1) % steps.length;
    spinTxt.textContent = steps[si];
  }, 900);

  fetch(API + '/process', {
    method:  'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      image_id: state.imageId,
      mode:     state.mode,
      params:   state.params[state.mode] || {},
    }),
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error) throw new Error(data.error);

    var incoming = parseSvg(data.svg);
    if (!incoming) throw new Error('Сервер вернул невалидный SVG');

    /* Fill both SVG elements */
    fillSvg(document.getElementById('svg-split'),  incoming);
    fillSvg(document.getElementById('svg-result'), incoming);

    /* Fill both original image elements */
    var src = state.origSrc || '';
    document.getElementById('orig-split').src = src;
    document.getElementById('orig-full').src  = src;

    /* Show tabs bar, switch to split view */
    show(document.getElementById('view-tabs'), 'flex');
    showPanel('p-split');

    /* Toolbar info */
    document.getElementById('i-mode').textContent  = data.mode;
    document.getElementById('i-lines').textContent = data.stroke_count.toLocaleString();
    document.getElementById('i-time').textContent  = data.elapsed_s + 's';

    /* Download button */
    var dl = document.getElementById('dl-btn');
    dl.href      = API + '/download/' + data.svg_file;
    dl.download  = data.svg_file;
    dl.className = 'tb-btn';

    showToast('Готово — ' + data.stroke_count.toLocaleString() + ' линий за ' + data.elapsed_s + 's', 'ok');
  })
  .catch(function(e) {
    showToast(e.message, 'err');
  })
  .then(function() {
    clearInterval(timer);
    hide(overlay);
    state.busy = false;
    updateBtn();
  });
}

/* ── Helpers ───────────────────────────────────────────────────────────── */
function updateBtn() {
  document.getElementById('process-btn').disabled = !state.imageId || state.busy;
}

var toastTimer;
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on ' + (type || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = 'toast'; }, 3500);
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
init();
</script>
