<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WavePrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0e0e10;
  --surface:  #18181c;
  --surface2: #222228;
  --border:   #2e2e38;
  --accent:   #c8f050;
  --accent2:  #50c8f0;
  --text:     #e8e8ee;
  --muted:    #8888a0;
  --danger:   #f05050;
  --radius:   10px;
  --mono:     'Space Mono', monospace;
  --sans:     'DM Sans', sans-serif;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 340px 1fr;
  grid-template-areas: "header header" "sidebar main";
}

/* ── Header ── */
header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 10;
}
.logo {
  font-family: var(--mono);
  font-size: 15px;
  letter-spacing: .06em;
  color: var(--accent);
}
.logo span { color: var(--muted); font-weight: 400; }
.badge {
  font-size: 10px;
  font-family: var(--mono);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 2px 8px;
  border-radius: 100px;
  letter-spacing: .08em;
}
header .status {
  margin-left: auto;
  font-size: 12px;
  font-family: var(--mono);
  color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  transition: background .3s;
}
.status-dot.ok  { background: var(--accent); }
.status-dot.err { background: var(--danger); }

/* ── Sidebar ── */
aside {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* Upload zone */
.upload-zone {
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: #c8f05010; }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-icon { font-size: 28px; margin-bottom: 8px; line-height: 1; }
.upload-zone p { font-size: 13px; color: var(--muted); line-height: 1.5; }
.upload-zone strong { color: var(--text); font-weight: 500; }

.thumb-wrap {
  display: none;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  position: relative;
}
.thumb-wrap img { width: 100%; display: block; }
.thumb-clear {
  position: absolute; top: 6px; right: 6px;
  background: #0009; color: #fff;
  border: none; border-radius: 50%;
  width: 22px; height: 22px;
  font-size: 14px; line-height: 22px; text-align: center;
  cursor: pointer;
}

/* Mode selector */
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.mode-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  text-align: left;
}
.mode-btn:hover { border-color: var(--muted); }
.mode-btn.active {
  border-color: var(--accent);
  background: #c8f05014;
}
.mode-btn .m-name {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  display: block;
  margin-bottom: 3px;
}
.mode-btn .m-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}

/* Params */
#params-area { display: flex; flex-direction: column; gap: 12px; }

.param-row { display: flex; flex-direction: column; gap: 5px; }
.param-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}
.param-head label { color: var(--text); font-weight: 500; }
.param-val {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  min-width: 36px;
  text-align: right;
}
.param-tip { font-size: 11px; color: var(--muted); line-height: 1.4; }

input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--surface2);
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: transform .1s;
}
input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }

.toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.toggle-wrap {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text); font-weight: 500;
}
.toggle {
  position: relative;
  width: 34px; height: 18px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 9px;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform .2s, background .2s;
}
.toggle.on::after { transform: translateX(16px); background: var(--bg); }

/* Process button */
.process-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.process-btn:hover { opacity: .88; }
.process-btn:active { transform: scale(.98); }
.process-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ── Main canvas ── */
main {
  grid-area: main;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.toolbar-info {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 16px;
}
.toolbar-info span { color: var(--text); }
.tb-btn {
  margin-left: auto;
  padding: 6px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  font-family: var(--mono);
  cursor: pointer;
  transition: border-color .15s;
  text-decoration: none;
  display: flex; align-items: center; gap: 6px;
}
.tb-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.tb-btn.disabled { opacity: .35; pointer-events: none; }

.canvas-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* View toggle tabs */
.view-tabs {
  display: flex;
  gap: 2px;
  padding: 8px 16px 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.view-tab {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .08em;
  padding: 6px 14px;
  border-radius: 6px 6px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  cursor: pointer;
  color: var(--muted);
  background: transparent;
  transition: color .15s, background .15s, border-color .15s;
}
.view-tab:hover { color: var(--text); }
.view-tab.active {
  color: var(--accent);
  background: var(--bg);
  border-color: var(--border);
}

/* Panels container */
.panels {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* Single panel */
.panel {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 28px;
  overflow: auto;
}
.panel.visible { display: flex; }

/* Split view */
.panel-split {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
}
.panel-split.visible { display: grid; grid-template-columns: 1fr 1fr; }

.split-pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
}
.split-pane:last-child { border-right: none; }

.split-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  color: var(--muted);
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.split-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: auto;
}

.canvas-empty {
  text-align: center;
  color: var(--muted);
  pointer-events: none;
}
.canvas-empty .big {
  font-size: 56px;
  line-height: 1;
  margin-bottom: 16px;
  opacity: .3;
}
.canvas-empty p { font-size: 14px; line-height: 1.7; }

.preview-img {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--radius);
  box-shadow: 0 0 0 1px var(--border);
  display: block;
  object-fit: contain;
}

#svg-output {
  max-width: 100%;
  max-height: 100%;
  border-radius: var(--radius);
  box-shadow: 0 0 0 1px var(--border);
  background: white;
}

.no-result {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

/* Loading overlay */
.loading-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: #0e0e1099;
  backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 5;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent);
  letter-spacing: .08em;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: transform .25s, opacity .25s;
  max-width: 320px;
}
.toast.show { transform: none; opacity: 1; }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.ok    { border-color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">WAVE<span>print</span></div>
  <span class="badge">ALPHA</span>
  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">connecting…</span>
  </div>
</header>

<aside>
  <!-- Upload -->
  <section>
    <div class="section-label">Изображение</div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.bmp,.webp"/>
      <div class="upload-icon">⬆</div>
      <p><strong>Перетащи или кликни</strong><br/>JPG, PNG, BMP, WEBP · до 20 МБ</p>
    </div>
    <div class="thumb-wrap" id="thumb-wrap">
      <img id="thumb" src="" alt="preview"/>
      <button class="thumb-clear" id="thumb-clear" title="Удалить">✕</button>
    </div>
  </section>

  <!-- Mode -->
  <section>
    <div class="section-label">Режим</div>
    <div class="mode-grid" id="mode-grid"></div>
  </section>

  <!-- Params -->
  <section>
    <div class="section-label">Настройки</div>
    <div id="params-area"></div>
  </section>

  <button class="process-btn" id="process-btn" disabled>▶ ОБРАБОТАТЬ</button>
</aside>

<main>
  <div class="toolbar">
    <div class="toolbar-info" id="toolbar-info">
      <span>режим: <span id="info-mode">—</span></span>
      <span>линий: <span id="info-strokes">—</span></span>
      <span>время: <span id="info-time">—</span></span>
    </div>
    <a class="tb-btn disabled" id="download-btn" download>↓ SVG</a>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <!-- View mode tabs (hidden until first result) -->
    <div class="view-tabs" id="view-tabs" style="display:none">
      <button class="view-tab active" data-view="split">SPLIT</button>
      <button class="view-tab" data-view="result">РЕЗУЛЬТАТ</button>
      <button class="view-tab" data-view="original">ОРИГИНАЛ</button>
    </div>

    <!-- Panels -->
    <div class="panels">
      <!-- Empty state -->
      <div class="panel visible" id="panel-empty">
        <div class="canvas-empty">
          <div class="big">✏</div>
          <p>Загрузи фото и выбери режим,<br/>затем нажми <strong>Обработать</strong></p>
        </div>
      </div>

      <!-- Split: original | result -->
      <div class="panel-split" id="panel-split">
        <div class="split-pane">
          <div class="split-label">ОРИГИНАЛ</div>
          <div class="split-content">
            <img class="preview-img" id="original-img" src="" alt="original"/>
          </div>
        </div>
        <div class="split-pane">
          <div class="split-label">РЕЗУЛЬТАТ · SVG</div>
          <div class="split-content" id="svg-split-wrap">
            <svg id="svg-output" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
      </div>

      <!-- Result only -->
      <div class="panel" id="panel-result">
        <div id="svg-result-wrap" style="max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;"></div>
      </div>

      <!-- Original only -->
      <div class="panel" id="panel-original">
        <img class="preview-img" id="original-img-full" src="" alt="original full"/>
      </div>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">ОБРАБОТКА…</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:5000/api';

const MODE_INFO = {
  contour:   { emoji: '✏',  desc: 'Контуры краёв объектов' },
  hatching:  { emoji: '≡',  desc: 'Параллельная штриховка' },
  stippling: { emoji: '·',  desc: 'Точечное заполнение' },
  flowfield: { emoji: '∿',  desc: 'Линии поля потока' },
};

let state = {
  imageId: null,
  mode: 'contour',
  params: {},
  modesData: null,
  svgFile: null,
  busy: false,
};

// ── Init ──────────────────────────────────────────────────────────────────

async function init() {
  try {
    const r = await fetch(`${API}/modes`);
    const data = await r.json();
    state.modesData = data;
    state.params = JSON.parse(JSON.stringify(data.defaults));
    renderModes();
    renderParams();
    await checkHealth();
  } catch (e) {
    setStatus('offline', 'сервер недоступен');
    toast('Запусти server.py на localhost:5000', 'error');
  }
}

async function checkHealth() {
  try {
    await fetch(`${API}/health`);
    setStatus('ok', 'сервер готов');
  } catch {
    setStatus('err', 'сервер недоступен');
  }
}

function setStatus(cls, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + cls;
  document.getElementById('status-text').textContent = text;
}

// ── Upload ────────────────────────────────────────────────────────────────

const fileInput   = document.getElementById('file-input');
const uploadZone  = document.getElementById('upload-zone');
const thumbWrap   = document.getElementById('thumb-wrap');
const thumbImg    = document.getElementById('thumb');
const thumbClear  = document.getElementById('thumb-clear');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

thumbClear.addEventListener('click', () => {
  state.imageId = null;
  thumbWrap.style.display = 'none';
  uploadZone.style.display = '';
  updateBtn();
});

async function handleFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  uploadZone.style.display = 'none';
  thumbWrap.style.display = 'block';
  thumbImg.src = URL.createObjectURL(file);

  try {
    const r = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    state.imageId = data.image_id;
    thumbImg.src = data.thumbnail;
    toast(`Загружено: ${data.filename} (${data.size[0]}×${data.size[1]})`, 'ok');
  } catch (e) {
    toast(e.message, 'error');
    thumbWrap.style.display = 'none';
    uploadZone.style.display = '';
  }
  updateBtn();
}

// ── Modes ─────────────────────────────────────────────────────────────────

function renderModes() {
  const grid = document.getElementById('mode-grid');
  grid.innerHTML = '';
  const modes = state.modesData?.modes || [];
  modes.forEach(m => {
    const info = MODE_INFO[m] || {};
    const btn = document.createElement('button');
    btn.className = 'mode-btn' + (m === state.mode ? ' active' : '');
    btn.innerHTML = `<span class="m-name">${info.emoji || ''} ${m}</span>
                     <span class="m-desc">${info.desc || ''}</span>`;
    btn.addEventListener('click', () => { state.mode = m; renderModes(); renderParams(); });
    grid.appendChild(btn);
  });
}

// ── Params ────────────────────────────────────────────────────────────────

function renderParams() {
  const area = document.getElementById('params-area');
  area.innerHTML = '';
  if (!state.modesData) return;

  const meta   = state.modesData.meta[state.mode] || [];
  const defs   = state.modesData.defaults[state.mode] || {};
  // init params for this mode if not already
  if (!state.params[state.mode]) {
    state.params[state.mode] = JSON.parse(JSON.stringify(defs));
  }
  const p = state.params[state.mode];

  meta.forEach(m => {
    if (p[m.key] === undefined) p[m.key] = defs[m.key];

    const row = document.createElement('div');

    if (m.type === 'bool') {
      row.className = 'param-row';
      const val = !!p[m.key];
      row.innerHTML = `
        <div class="toggle-row">
          <div class="toggle-wrap">
            <div class="toggle ${val ? 'on' : ''}" data-key="${m.key}"></div>
            <label>${m.label}</label>
          </div>
        </div>
        <div class="param-tip">${m.tip || ''}</div>`;
      row.querySelector('.toggle').addEventListener('click', function() {
        p[m.key] = !p[m.key];
        this.classList.toggle('on', p[m.key]);
      });

    } else {
      const cur = p[m.key] !== undefined ? p[m.key] : m.min;
      row.className = 'param-row';
      row.innerHTML = `
        <div class="param-head">
          <label>${m.label}</label>
          <span class="param-val" id="pv-${m.key}">${cur}</span>
        </div>
        <input type="range" min="${m.min}" max="${m.max}" step="${m.step}" value="${cur}" data-key="${m.key}"/>
        <div class="param-tip">${m.tip || ''}</div>`;
      row.querySelector('input').addEventListener('input', function() {
        const v = parseFloat(this.value);
        p[m.key] = v;
        document.getElementById(`pv-${m.key}`).textContent = v;
      });
    }
    area.appendChild(row);
  });
}

// ── View tabs ─────────────────────────────────────────────────────────────

let activeView = 'split';

function switchView(view) {
  activeView = view;
  document.querySelectorAll('.view-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  document.getElementById('panel-empty').classList.remove('visible');
  document.getElementById('panel-split').classList.remove('visible');
  document.getElementById('panel-result').classList.remove('visible');
  document.getElementById('panel-original').classList.remove('visible');
  if (view === 'split')    document.getElementById('panel-split').classList.add('visible');
  if (view === 'result')   document.getElementById('panel-result').classList.add('visible');
  if (view === 'original') document.getElementById('panel-original').classList.add('visible');
}

document.querySelectorAll('.view-tab').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

function parseSvg(svgText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgText, 'image/svg+xml');
  return doc.querySelector('svg');
}

function applySvgTo(el, incoming) {
  el.innerHTML = '';
  Array.from(incoming.attributes).forEach(a => el.setAttribute(a.name, a.value));
  el.removeAttribute('width');
  el.removeAttribute('height');
  el.style.maxWidth = '100%';
  el.style.maxHeight = '100%';
  el.innerHTML = incoming.innerHTML;
}

// ── Process ───────────────────────────────────────────────────────────────

document.getElementById('process-btn').addEventListener('click', process);

async function process() {
  if (!state.imageId || state.busy) return;
  state.busy = true;
  updateBtn();

  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('show');

  const steps = ['АНАЛИЗ ИЗОБРАЖЕНИЯ…', 'ТРАССИРОВКА ЛИНИЙ…', 'ОПТИМИЗАЦИЯ ПУТЕЙ…', 'ГЕНЕРАЦИЯ SVG…'];
  let si = 0;
  const lt = document.getElementById('loading-text');
  lt.textContent = steps[0];
  const stepInterval = setInterval(() => {
    si = (si + 1) % steps.length;
    lt.textContent = steps[si];
  }, 900);

  try {
    const r = await fetch(`${API}/process`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image_id: state.imageId,
        mode:     state.mode,
        params:   state.params[state.mode] || {},
      }),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    const incoming = parseSvg(data.svg);
    if (incoming) {
      // Split view — left SVG
      applySvgTo(document.getElementById('svg-output'), incoming);

      // Result-only panel — clone into wrapper
      const wrap = document.getElementById('svg-result-wrap');
      wrap.innerHTML = '';
      const clone = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      applySvgTo(clone, incoming);
      clone.style.borderRadius = '10px';
      clone.style.boxShadow = '0 0 0 1px #2e2e38';
      clone.style.background = 'white';
      wrap.appendChild(clone);
    }

    // Show tabs, switch to split view
    document.getElementById('view-tabs').style.display = '';
    switchView('split');

    // Info bar
    document.getElementById('info-mode').textContent = data.mode;
    document.getElementById('info-strokes').textContent = data.stroke_count.toLocaleString();
    document.getElementById('info-time').textContent = data.elapsed_s + 's';

    // Download
    state.svgFile = data.svg_file;
    const dl = document.getElementById('download-btn');
    dl.href = `${API}/download/${data.svg_file}`;
    dl.download = data.svg_file;
    dl.classList.remove('disabled');

    toast(`Готово — ${data.stroke_count.toLocaleString()} линий за ${data.elapsed_s}s`, 'ok');

  } catch (e) {
    toast(e.message, 'error');
  } finally {
    clearInterval(stepInterval);
    overlay.classList.remove('show');
    state.busy = false;
    updateBtn();
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────

function updateBtn() {
  const btn = document.getElementById('process-btn');
  btn.disabled = !state.imageId || state.busy;
}

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Boot ──────────────────────────────────────────────────────────────────
init();
</script>
</body>
